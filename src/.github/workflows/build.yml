name: Build Pico Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

    - name: Configure
      run: |
        cmake -B build -G Ninja

    - name: Build
      run: |
        cmake --build build

    - name: Upload UF2
      uses: actions/upload-artifact@v4
      with:
        name: telinkdebugger-uf2
        path: |
          build/*.uf2
          build/*.elf
          build/*.bin
